name: Surveillance service (.NET)

on:
  push:
    branches: [main]
    paths:
      - "regos-sentinel/services/surveillance/**"
      - ".github/workflows/surveillance.yml"
  pull_request:
    paths:
      - "regos-sentinel/services/surveillance/**"
      - ".github/workflows/surveillance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surveillance-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SA_PASSWORD: "Ci_only_Passw0rd!"

jobs:
  test:
    name: Build, test (SQLite + SQL Server + Kafka), evaluate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regos-sentinel/services/surveillance

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_only_Passw0rd!"
        ports: ["1433:1433"]
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: regos-sentinel/services/surveillance/web/package-lock.json

      - name: Console - typecheck and build
        working-directory: regos-sentinel/services/surveillance/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build (warnings are errors)
        run: dotnet build -c Release

      - name: Unit + API tests on SQLite
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Wait for SQL Server and Kafka
        run: |
          for i in $(seq 1 60); do
            docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 60); do
            docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && break
            sleep 2
          done

      - name: API tests against SQL Server 2022 and Kafka (stored procedure, row-version concurrency, exactly-once consume)
        env:
          SURV_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci_only_Passw0rd!;TrustServerCertificate=True"
          SURV_KAFKA: "localhost:9092"
        run: dotnet test tests/Surveillance.Api.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Detection quality and throughput on a 1M-event synthetic tape
        run: |
          dotnet run -c Release --no-build --project tools/Surveillance.Sim -- eval --events 1000000 --scenarios 150 --seed 42 | tee eval.txt
          { echo '### Synthetic-tape evaluation (seed 42)'; echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t regos-surveillance:ci regos-sentinel/services/surveillance
