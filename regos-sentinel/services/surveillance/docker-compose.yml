# Full stack: SQL Server 2022 + Kafka (KRaft, no ZooKeeper) + the surveillance API and console on :8080.
#   docker compose up --build
#   dotnet run --project tools/Surveillance.Sim -- post --url http://localhost:8080 --events 200000
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_dev_only_1!"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Local_dev_only_1!' -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6

  surveillance:
    build: .
    depends_on:
      mssql: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__Surveillance: "Server=mssql;Database=Surveillance;User Id=sa;Password=Local_dev_only_1!;TrustServerCertificate=True"
      Kafka__BootstrapServers: kafka:9092
    ports: ["8080:8080"]
